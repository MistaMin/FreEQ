[package]
name = "openplugin-eq"
version = "0.2.0"
edition = "2021"
description = "FreEQ: six-band equaliser on OpenPlugin SDK"
license = "MIT"
authors = ["Marcos Quirino Deida"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
cpal = "0.15"
goodlookindri-shell = { path = "../../Dependencies/GoodLookinDri/shell" }
openplugin = { path = "../../Dependencies/OpenPluginSDK/crates/openplugin" }
openplugin-targets = { path = "../../Dependencies/OpenPluginSDK/crates/openplugin-targets" }

[[bin]]
name = "openplugin-eq"
path = "src/bin/window.rs"

[[bin]]
name = "openplugin-eq-cpu"
path = "src/bin/cpu.rs"
